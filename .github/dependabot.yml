version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build: 升级项目依赖"
    groups:
      # 主版本升级单独审查，合并低风险的次版本和修订版本更新。
      compatible-dependencies:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci: 更新工作流依赖"
    groups:
      compatible-actions:
        update-types:
          - minor
          - patch
